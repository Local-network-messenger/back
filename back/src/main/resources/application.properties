# Application Properties
spring.application.name=LocalMessenger
server.port=8080
spring.main.allow-bean-definition-overriding=true
back.logPath=../config/local-config.json
# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
## Grafana
management.endpoints.web.exposure.include=health,info,metrics,prometheus
## jmDNS
spring.jmDNS.service-type=_messenger._tcp.local.
spring.jmDNS.name=LocalMessenger
spring.jmDNS.service-name=messenger-${HOSTNAME:unknown}
spring.jmDNS.service-port=${server.port}
spring.jmDNS.discovery-enabled=true
spring.jmDNS.jsonKey=runtimeData
spring.jmDNS.version=2.0
spring.jmDNS.app=${spring.application.name}
spring.jmDNS.timeout-request=5000
spring.jmDNS.timeout-refresh=3000
spring.jmDNS.cleanup-timeout-seconds=30