services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: local-messenger-db
    environment:
      POSTGRES_DB: messenger_db
      POSTGRES_USER: messenger_user
      POSTGRES_PASSWORD: messenger_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - messenger-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger_user -d messenger_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # DB Handler Microservice (gRPC Server)
  db_service:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: local-messenger/db-handler:latest
    container_name: local-messenger-db-service
    environment:
      SPRING_APPLICATION_NAME: db-handler
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/messenger_db
      SPRING_DATASOURCE_USERNAME: messenger_user
      SPRING_DATASOURCE_PASSWORD: messenger_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      GRPC_SERVER_PORT: 9090
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - messenger-network
    restart: unless-stopped

  # Main Backend Microservice (REST API)
  back_service:
    build:
      context: ./back
      dockerfile: Dockerfile
    image: local-messenger/backend:latest
    container_name: local-messenger-backend
    environment:
      SPRING_APPLICATION_NAME: LocalMessenger
      SERVER_PORT: 8080
      DB_SERVICE_HOST: db_service
      DB_SERVICE_PORT: 9090
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
      - "5005:5005"
    depends_on:
      db_service:
        condition: service_started
    networks:
      - messenger-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  messenger-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
